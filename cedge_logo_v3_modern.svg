<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cedge Logo - V3 Layered (Lora Serif)
  Wordmark: Lora (Georgia-like, OFL free, consistent across all environments)
  C/Edge color split for pronunciation cue.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 150" width="575" height="150">
  <defs>
    <linearGradient id="frontGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="backGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g transform="translate(20, 25)">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <path d="M 26 88 L 78 88 L 78 30 Z" fill="url(#backGrad)"/>
      <path d="M 18 80 L 70 80 L 70 22 Z" fill="url(#frontGrad)"/>
    </svg>
  </g>
  <text x="115" y="105" 
        font-family="Lora, Georgia, 'Times New Roman', serif" 
        font-size="78" font-weight="500">
    <tspan fill="#0A2540">C</tspan><tspan fill="#1E3A8A">Edge</tspan>
  </text>
</svg>